name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: coder-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: coder-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: coder-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: coder-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: coder-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: coder-windows-arm64.exe
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/coder
      - if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/coder ${{ matrix.asset }}
      - if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/coder.exe ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
