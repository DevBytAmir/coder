name: Feature request
description: Something coder could do that it doesn't yet
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys or the contents of `secrets.env`.**
        If the idea is about a weakness in the sandbox or the proxy, report it through [private vulnerability reporting](https://github.com/DevBytAmir/coder/security/advisories/new) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do, and where coder got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The command, flag or behavior you have in mind, and what it would print or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you use now, or other tools that already do this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Running agents (coder run)
        - Proxy and keys
        - Images (coder build)
        - Plugin for Claude Code or Codex
        - Install and setup
        - Something else
    validations:
      required: true
