[package]
name = "coder"
version = "0.1.0"
edition = "2021"

[lib]
name = "coder"
path = "src/lib.rs"

[[bin]]
name = "coder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
http = "1"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.4", features = ["util"] }
