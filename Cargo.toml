[package]
name = "coder"
version = "0.5.0"
edition = "2021"
rust-version = "1.91"
description = "Runs AI coding agents in rootless podman containers behind a proxy that holds the real API keys"
license = "Apache-2.0"
repository = "https://github.com/DevBytAmir/coder"
readme = "README.md"
keywords = ["ai", "agents", "sandbox", "podman", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "coder"
path = "src/lib.rs"

[[bin]]
name = "coder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
http = "1"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
ctrlc = { version = "3", features = ["termination"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.4", features = ["util"] }
